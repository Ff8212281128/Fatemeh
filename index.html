<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نمایش ۱۰ عکس با پر و موسیقی</title>
<style>
  :root{
    --fade: 1800ms;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    height:100%;
    overflow:hidden;
    background:#05060a;
    font-family: Tahoma, "Segoe UI", system-ui, sans-serif;
    color:#fff;
  }

  #stage{ position:fixed; inset:0; overflow:hidden; background:#05060a; }

  .slide{
    position:absolute; inset:0;
    background-size:cover;
    background-position:center;
    opacity:0;
    transform:scale(1);
    transition: opacity var(--fade) ease-in-out,
                transform 18s linear;
    will-change: opacity, transform;
  }
  .slide.active{
    opacity:1;
    transform:scale(1.07);
  }

  #fx{
    position:absolute; inset:0;
    width:100%; height:100%;
    pointer-events:none;
  }

  #vignette{
    position:absolute; inset:0;
    pointer-events:none;
    background: radial-gradient(ellipse at center,
                rgba(0,0,0,0) 42%, rgba(0,0,0,.62) 100%);
  }

  #overlay{
    position:fixed; inset:0; z-index:10;
    display:flex; align-items:center; justify-content:center;
    background: radial-gradient(circle at 50% 38%, #151a2e 0%, #05060a 72%);
    transition: opacity .9s ease, visibility .9s;
  }
  #overlay.hide{ opacity:0; visibility:hidden; }

  .panel{ text-align:center; padding:24px; }

  .panel h1{
    font-size: clamp(20px, 4vw, 34px);
    font-weight:600;
    letter-spacing:.5px;
    margin-bottom:10px;
    background:linear-gradient(180deg,#fff,#b9c4e0);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .panel p{
    font-size:14px;
    color:#8f9bb8;
    margin-bottom:30px;
  }

  #startBtn{
    font-family:inherit;
    font-size:18px;
    padding:15px 46px;
    border:none;
    border-radius:999px;
    cursor:pointer;
    color:#1a1c24;
    background:linear-gradient(180deg,#ffffff,#e6e0d4);
    box-shadow: 0 0 0 1px rgba(255,255,255,.22),
                0 12px 44px rgba(160,180,255,.20),
                0 0 90px rgba(150,175,255,.18);
    transition: transform .25s ease, box-shadow .25s ease;
  }
  #startBtn:hover{
    transform: translateY(-2px) scale(1.035);
    box-shadow: 0 0 0 1px rgba(255,255,255,.35),
                0 16px 56px rgba(160,180,255,.32),
                0 0 120px rgba(150,175,255,.28);
  }
  #startBtn:active{ transform: translateY(0) scale(.98); }
</style>
</head>
<body>

<div id="stage">
  <canvas id="fx"></canvas>
  <div id="vignette"></div>
</div>

<div id="overlay">
  <div class="panel">
    <h1>نمایش ۱۰ عکس با پر و موسیقی</h1>
    <p>برای شروع، دکمه زیر را بزنید</p>
    <button id="startBtn">▶ شروع نمایش</button>
  </div>
</div>

<audio id="bgm" loop preload="auto"></audio>

<script>
/* =========================================================
   ۱) تنظیمات اصلی — ۱۰ تصویر
   ========================================================= */

/* --- حالت اول: فایل‌های محلی داخل پوشه images --- */
const IMAGES = [
  'images/01.jpg',
  'images/02.jpg',
  'images/03.jpg',
  'images/04.jpg',
  'images/05.jpg',
  'images/06.jpg',
  'images/07.jpg',
  'images/08.jpg',
  'images/09.jpg',
  'images/10.jpg'
];

/* --- حالت دوم: اگر می‌خواهید فعلاً تست کنید، خط زیر را فعال کنید و
       خط IMAGES بالا را کامنت کنید (تصاویر آنلاین نمونه) --- */
/*
const IMAGES = Array.from({length: 10}, (_, i) =>
  `https://picsum.photos/id/${[1015,1016,1018,1039,1043,1044,1050,1060,1062,1069][i]}/1920/1080`
);
*/

const MUSIC_FILE      = 'music.mp3'; // فایل آهنگ کنار HTML
const SLIDE_MS        = 6000;        // هر عکس ۶ ثانیه (برای ۱۰ عکس ≈ ۱ دقیقه دور کامل)
const FADE_MS         = 1800;        // مدت محو/ظاهر شدن
const FEATHER_DENSITY = 55;          // هرچه کوچکتر، پرهای بیشتر

/* =========================================================
   ۲) آماده‌سازی
   ========================================================= */
const stage    = document.getElementById('stage');
const canvas   = document.getElementById('fx');
const ctx      = canvas.getContext('2d');
const overlay  = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const bgm      = document.getElementById('bgm');

document.documentElement.style.setProperty('--fade', FADE_MS + 'ms');
bgm.src = MUSIC_FILE;

/* ---------- اسلایدها ---------- */
const slides = IMAGES.map(src => {
  const d = document.createElement('div');
  d.className = 'slide';
  d.style.backgroundImage = `url("${src}")`;
  stage.insertBefore(d, canvas);
  return d;
});

let currentIndex = -1;
function nextSlide(){
  currentIndex = (currentIndex + 1) % slides.length;
  slides.forEach((s, i) => s.classList.toggle('active', i === currentIndex));
}

/* =========================================================
   ۳) موتور پرها (Canvas)
   ========================================================= */
let W = 0, H = 0, DPR = 1;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  syncFeatherCount();
}

const rnd = (a, b) => a + Math.random() * (b - a);

class Feather{
  constructor(seeded){
    this.reset(seeded);
  }

  reset(seeded){
    this.len     = rnd(20, 44);
    this.scale   = rnd(0.8, 1.6);
    this.x       = rnd(-60, W + 60);
    this.baseX   = this.x;
    this.y       = seeded ? rnd(-60, H) : rnd(-H * 0.3 - 140, -70);

    this.vy      = rnd(13, 32);
    this.swayAmp = rnd(14, 44);
    this.swaySpd = rnd(0.35, 0.85);
    this.phase   = rnd(0, Math.PI * 2);
    this.drift   = rnd(-7, 7);

    this.baseRot = rnd(-0.55, 0.55);
    this.rotAmp  = rnd(0.25, 0.85);
    this.rotSpd  = rnd(0.3, 0.95);

    this.alpha   = rnd(0.45, 0.92);
    this.jag     = rnd(0, 12);
    this.rot     = this.baseRot;
  }

  update(dt){
    this.phase += this.swaySpd * dt;
    this.baseX += this.drift * dt;
    this.x      = this.baseX + Math.sin(this.phase) * this.swayAmp;
    this.y     += this.vy * dt;
    this.rot    = this.baseRot + Math.sin(this.phase * this.rotSpd) * this.rotAmp;

    if (this.y > H + 140 || this.baseX < -260 || this.baseX > W + 260){
      this.reset(false);
    }
  }

  draw(){
    const L        = this.len * this.scale;
    const Wd       = L * 0.30;
    const tipY     = -L * 0.50;
    const vaneBot  =  L * 0.38;
    const quillEnd =  L * 0.60;
    const N        = 16;

    ctx.save();
    ctx.translate(this.x, this.y);
    ctx.rotate(this.rot);
    ctx.globalAlpha = this.alpha;
    ctx.lineJoin = 'round';

    ctx.shadowColor  = 'rgba(0,0,0,0.38)';
    ctx.shadowBlur   = 5;
    ctx.shadowOffsetY = 3;

    const g = ctx.createLinearGradient(-Wd, 0, Wd, 0);
    g.addColorStop(0.00, '#ffffff');
    g.addColorStop(0.45, '#f7f4ed');
    g.addColorStop(0.78, '#e4ded1');
    g.addColorStop(1.00, '#cbc3b3');
    ctx.fillStyle = g;

    ctx.beginPath();
    ctx.moveTo(0, vaneBot);

    for (let i = 0; i <= N; i++){
      const t = i / N;
      const y = vaneBot + (tipY - vaneBot) * t;
      let w = Wd * Math.sin(Math.PI * Math.pow(t, 0.85));
      w *= 1 + 0.13 * Math.sin(t * 22 + this.jag);
      ctx.lineTo(-w, y);
    }
    for (let i = N; i >= 0; i--){
      const t = i / N;
      const y = vaneBot + (tipY - vaneBot) * t;
      let w = Wd * Math.sin(Math.PI * Math.pow(t, 0.85));
      w *= 1 + 0.13 * Math.cos(t * 19 + this.jag);
      ctx.lineTo(w, y);
    }
    ctx.closePath();
    ctx.fill();

    ctx.shadowColor = 'transparent';
    ctx.strokeStyle = 'rgba(148,138,118,0.55)';
    ctx.lineWidth   = Math.max(0.8, L * 0.022);
    ctx.lineCap     = 'round';
    ctx.beginPath();
    ctx.moveTo(0, quillEnd);
    ctx.lineTo(0, tipY * 0.92);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(255,255,255,0.65)';
    ctx.lineWidth   = Math.max(0.5, L * 0.012);
    ctx.beginPath();
    ctx.moveTo(-Wd * 0.10, vaneBot * 0.7);
    ctx.quadraticCurveTo(-Wd * 0.45, 0, -Wd * 0.05, tipY * 0.75);
    ctx.stroke();

    ctx.restore();
  }
}

let feathers = [];
function syncFeatherCount(){
  const target = Math.max(14, Math.min(36, Math.round(W / FEATHER_DENSITY)));
  while (feathers.length < target) feathers.push(new Feather(true));
  if (feathers.length > target) feathers.length = target;
}

let lastTime = performance.now();
function loop(now){
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;

  ctx.clearRect(0, 0, W, H);
  for (const f of feathers){
    f.update(dt);
    f.draw();
  }
  requestAnimationFrame(loop);
}

window.addEventListener('resize', resize);
resize();
requestAnimationFrame(loop);

/* =========================================================
   ۴) موسیقی (mp3 + پشتیبان Web Audio)
   ========================================================= */
let ambientStarted = false;

function startAmbient(){
  if (ambientStarted) return;
  ambientStarted = true;

  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;

  const ac = new AC();
  const master = ac.createGain();
  master.gain.setValueAtTime(0.0001, ac.currentTime);
  master.gain.linearRampToValueAtTime(0.55, ac.currentTime + 4);
  master.connect(ac.destination);

  const delay = ac.createDelay(1.0);
  delay.delayTime.value = 0.5;
  const fb  = ac.createGain(); fb.gain.value  = 0.32;
  const wet = ac.createGain(); wet.gain.value = 0.40;
  delay.connect(fb); fb.connect(delay);
  delay.connect(wet); wet.connect(master);

  [65.41, 98.00].forEach((f, i) => {
    const o = ac.createOscillator();
    o.type = 'sine';
    o.frequency.value = f;
    const g = ac.createGain();
    g.gain.value = i === 0 ? 0.10 : 0.055;
    o.connect(g); g.connect(master);
    o.start();

    const lfo = ac.createOscillator();
    lfo.frequency.value = 0.07 + i * 0.03;
    const lg = ac.createGain(); lg.gain.value = 0.05;
    lfo.connect(lg); lg.connect(g.gain);
    lfo.start();
  });

  const scale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33, 659.25];

  function playNote(freq, t, dur, vol){
    const o = ac.createOscillator();
    o.type = 'sine';
    o.frequency.value = freq;

    const o2 = ac.createOscillator();
    o2.type = 'triangle';
    o2.frequency.value = freq * 2.004;

    const g = ac.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + dur * 0.28);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    const g2 = ac.createGain(); g2.gain.value = 0.16;

    o.connect(g);
    o2.connect(g2); g2.connect(g);
    g.connect(master);
    g.connect(delay);

    o.start(t);  o.stop(t + dur + 0.06);
    o2.start(t); o2.stop(t + dur + 0.06);
  }

  let nextTime = ac.currentTime + 0.3;
  function scheduler(){
    while (nextTime < ac.currentTime + 3){
      const f = scale[Math.floor(Math.random() * scale.length)];
      playNote(f, nextTime, 3.2, 0.11);
      if (Math.random() < 0.35) playNote(f * 2, nextTime + 0.55, 2.4, 0.05);
      if (Math.random() < 0.25) playNote(f / 2, nextTime + 0.9, 4.0, 0.06);
      nextTime += 1.6 + Math.random() * 1.3;
    }
  }
  scheduler();
  setInterval(scheduler, 1000);
}

bgm.addEventListener('error', startAmbient);

/* =========================================================
   ۵) شروع
   ========================================================= */
let slideTimer = null;

startBtn.addEventListener('click', async () => {
  overlay.classList.add('hide');

  try{
    bgm.volume = 0.7;
    await bgm.play();
  }catch(err){
    startAmbient();
  }

  nextSlide();
  slideTimer = setInterval(nextSlide, SLIDE_MS);
});

document.addEventListener('visibilitychange', () => {
  if (!document.hidden) lastTime = performance.now();
});
</script>
</body>
</html>
